name: Sync Fork with Upstream

on:
  schedule:
    - cron: '0 9 * * *' 
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run assessment without creating Issues or PRs (Dry Run)'
        required: true
        type: boolean
        default: true # Defaults to true so manual clicks are safe
      force_assessment:
        description: 'Force assessment even if no new updates are synced'
        required: true
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    # Export this variable so the next job can read it
    outputs:
      has_updates: ${{ steps.verify.outputs.updated }} 

    steps:
      - name: Record commit hash before sync
        run: |
          # Query GitHub directly for the current commit hash of your main branch
          BEFORE_SHA=$(git ls-remote https://github.com/${{ github.repository }}.git main | awk '{print $1}')
          echo "BEFORE_SHA=$BEFORE_SHA" >> $GITHUB_ENV

      - name: Sync main branch with upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SYNC_OUTPUT=$(gh repo sync ${{ github.repository }} --branch main --source Haribu/TIDIR 2>&1)
          
          echo "### 🔄 Fork Sync Result" >> $GITHUB_STEP_SUMMARY
          echo "Attempted to sync \`${{ github.repository }}:main\` with \`Haribu/TIDIR\`." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Command Output:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
          echo "$SYNC_OUTPUT" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Verify if updates occurred
        id: verify
        run: |
          # Query GitHub again for the new commit hash
          AFTER_SHA=$(git ls-remote https://github.com/${{ github.repository }}.git main | awk '{print $1}')
          
          if [ "$BEFORE_SHA" != "$AFTER_SHA" ]; then
            echo "updated=true" >> $GITHUB_OUTPUT
            echo "✅ **Status:** Updates were pulled. Triggering assessment agents." >> $GITHUB_STEP_SUMMARY
          else
            echo "updated=false" >> $GITHUB_OUTPUT
            echo "⏸️ **Status:** No new updates found. Assessment skipped." >> $GITHUB_STEP_SUMMARY
          fi
          
      - name: Checkout maintenance branch for syncing
        if: steps.verify.outputs.updated == 'true'
        uses: actions/checkout@v7
        with:
          ref: fork-maintainance
          fetch-depth: 0 # Required to fetch all branches so we can merge

      - name: Merge updated main into maintenance branch
        if: steps.verify.outputs.updated == 'true'
        run: |
          # Set up the git bot credentials
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Fetch the newly synced main branch
          git fetch origin main
          
          # Merge main into our current branch (fork-maintainance)
          git merge origin/main -m "chore: auto-sync maintenance branch with updated main"
          
          # Push the changes back to GitHub
          git push origin fork-maintainance
          
          echo "🔄 **Status:** Automatically merged latest \`main\` into \`fork-maintainance\` to keep tools aligned." >> $GITHUB_STEP_SUMMARY

  # This job only runs if the sync job detected a change
  run_agents:
    needs: sync
    if: needs.sync.outputs.has_updates == 'true' || inputs.force_assessment == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout maintenance branch (gets your scripts)
        uses: actions/checkout@v7

      - name: Stash agent scripts safely
        run: |
          mkdir -p /tmp/agent-tools
          cp -r scripts /tmp/agent-tools/
          cp REVIEW.md /tmp/agent-tools/

      - name: Checkout updated code (main branch)
        uses: actions/checkout@v7
        with:
          ref: main
          clean: true
          
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Execute MD Agents
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} 
          GH_TOKEN: ${{ secrets.PAT_TOKEN }} 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # Copy the REVIEW.md file into the main branch workspace so the script finds it
          cp /tmp/agent-tools/REVIEW.md ./REVIEW.md
          
          # Execute the script from the safe stash location
          AGENT_OUTPUT=$(bun run /tmp/agent-tools/scripts/run_brutality.ts)
          
          echo "### 🤖 MD Agent Assessment Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "$AGENT_OUTPUT" >> $GITHUB_STEP_SUMMARY
